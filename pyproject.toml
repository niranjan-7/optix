[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trader"
version = "0.1.0"
requires-python = ">=3.11"
description = "Semi-automated NIFTY options system (paper mode first)"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trader = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
